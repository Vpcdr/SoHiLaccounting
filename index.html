<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حسابانه</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1a2233;--m:#6b7688;--p:#0f766e;--b:#e2e6ec;--r:#dc2626;--y:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151c;--c:#1a212b;--t:#e8edf3;--m:#93a0b2;--b:#2a3340}}
:root[data-theme=dark]{--bg:#10151c;--c:#1a212b;--t:#e8edf3;--m:#93a0b2;--b:#2a3340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;font:14px Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--t)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--c);z-index:10}
#nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
#nav button{background:none;color:var(--m);white-space:nowrap}#nav .on{background:var(--p);color:#fff}
#main{padding:12px;max-width:1100px;margin:auto}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}button.g{background:none;color:var(--t);border:1px solid var(--b)}button.d{background:var(--r)}button.s{padding:3px 8px;font-size:12px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}label{display:block;margin:6px 0;color:var(--m);font-size:12px}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.cd,.pn{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}.cd small{color:var(--m)}.cd b{display:block;font-size:16px;margin-top:4px}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m)}
tr.cr td{color:var(--r)}tr.cy td{color:var(--y)}.tb{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tb input,.tb select{width:auto;flex:1;min-width:120px}
#mb{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:20;padding:10px}.md{background:var(--c);border-radius:14px;padding:16px;width:100%;max-width:660px;max-height:90vh;overflow:auto}
.bt{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}.ln{border:1px solid var(--b);border-radius:8px;padding:6px;margin-bottom:6px}
.bi{border-radius:10px;padding:10px;margin-bottom:8px;color:#fff}.br{background:var(--r)}.by{background:var(--y)}.bar{height:8px;background:var(--p);border-radius:4px;min-width:2px}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:30}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff;padding:10px}#pa td,#pa th{border:1px solid #999}}
</style></head><body><div id="nav"></div><div id="main"></div><div id="mb" onclick="if(event.target==this)mc()"></div><div id="pa"></div><div id="ts"></div><script>
const $=s=>document.querySelector(s);
let D={persons:[],banks:[],cats:[],tx:[],cheques:[],items:[],invoices:[],set:{tax:9,unit:'تومان',name:'کسب‌وکار من',addr:'',theme:''},log:[]};
try{const x=localStorage.getItem('hesabane');if(x)D={...D,...JSON.parse(x)}}catch(e){}
if(!D.cats.length)D.cats=[['درآمد','فروش خدمات'],['درآمد','درآمد متفرقه'],['هزینه','حقوق و دستمزد'],['هزینه','اجاره'],['هزینه','آب، برق، گاز و تلفن'],['هزینه','حمل‌ونقل'],['هزینه','هزینه‌های متفرقه']].map(([kind,name],i)=>({id:'c'+i,kind,name,parent:'',desc:''}));
const save=()=>{try{localStorage.setItem('hesabane',JSON.stringify(D))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fa=n=>Math.round(+n||0).toLocaleString('fa-IR');
const pn=s=>+String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٬,\s]/g,'')||0;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const jd=d=>d&&d!='0000'?new Date(d+'T12:00').toLocaleDateString('fa-IR'):'';
const jym=d=>{const p=new Intl.DateTimeFormat('fa-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit'}).formatToParts(new Date(d+'T12:00'));return p.find(x=>x.type=='year').value+'/'+p.find(x=>x.type=='month').value};
const dd=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>fa(n)+' '+D.set.unit;
const nm=(k,id)=>{const x=D[k].find(y=>y.id==id);return x?(x.name||x.number):'—'};
const nf=e=>{const v=pn(e.value);e.value=v?fa(v):''};
const modal=h=>{$('#mb').innerHTML='<div class=md>'+h+'</div>';$('#mb').style.display='flex'};
const mc=()=>$('#mb').style.display='none';
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200)};
const commit=m=>{if(m){D.log.unshift({t:new Date().toLocaleString('fa-IR'),m});D.log.length=Math.min(D.log.length,200)}save();render()};
const clip=t=>{try{navigator.clipboard.writeText(t).then(()=>toast('کپی شد'))}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('کپی شد')}};
const TABS=[['home','داشبورد'],['invoices','فاکتورها'],['persons','اشخاص'],['items','کالا و خدمات'],['cheques','چک‌ها'],['banks','بانک‌ها'],['tx','درآمد و هزینه'],['cats','دسته‌بندی‌ها'],['reports','گزارش‌ها'],['settings','تنظیمات']];
const SC={
persons:{t:'اشخاص',f:[['name','نام و نام خانوادگی','t'],['type','نوع','s',['مشتری','فروشنده']],['phone','تلفن','t'],['nid','کد ملی','t'],['addr','آدرس','t'],['grp','گروه (دلخواه)','t'],['active','وضعیت','s',['فعال','غیرفعال']]],cols:['name','type','phone','grp','active','bal']},
banks:{t:'بانک‌ها',f:[['name','نام بانک','t'],['branch','شعبه','t'],['acc','شماره حساب','t'],['sheba','شماره شبا','t'],['init','موجودی اولیه','n']],cols:['name','branch','acc','bal']},
cats:{t:'دسته‌بندی‌ها',f:[['name','نام','t'],['kind','نوع','s',['درآمد','هزینه']],['parent','زیرمجموعهٔ','r','cats'],['desc','توضیح','t']],cols:['name','kind','parent']},
tx:{t:'درآمد و هزینه',f:[['date','تاریخ','d'],['kind','نوع','s',['هزینه','درآمد']],['cat','دسته','r','cats'],['amount','مبلغ','n'],['bank','بانک','r','banks'],['desc','توضیح','t']],cols:['date','kind','cat','amount','bank','desc']},
items:{t:'کالا و خدمات',f:[['name','نام','t'],['kind','نوع','s',['کالا','خدمت']],['unit','واحد','t'],['buy','قیمت خرید','n'],['sell','قیمت فروش','n'],['stock','موجودی (کالا)','n'],['min','حداقل موجودی','n'],['sku','کد / بارکد','t'],['dur','مدت خدمت (دقیقه)','n']],cols:['name','kind','sell','stock']},
cheques:{t:'چک‌ها',f:[['number','شماره چک','t'],['kind','نوع','s',['دریافتی','پرداختی']],['person','شخص','r','persons'],['bank','بانک','r','banks'],['amount','مبلغ','n'],['issue','تاریخ صدور','d'],['due','تاریخ سررسید','d'],['status','وضعیت','s',['در جریان','وصول‌شده','برگشتی','منقضی']],['rd','تاریخ وصول/برگشت','e'],['notes','توضیح','t']],cols:['number','kind','person','bank','amount','due','status']}};
let tab='home',q='',chq='all',rep='sales',repArg='',last=null,cur=null;
const act=i=>i.st=='auto';
const tot=i=>{const sub=i.lines.reduce((a,l)=>a+l.qty*l.price*(1-(l.disc||0)/100),0),af=Math.max(0,sub-(i.disc||0)),tx=af*(i.tax||0)/100;return{sub,af,tx,total:af+tx,paid:i.pays.reduce((a,p)=>a+p.amount,0)}};
const bankEnt=id=>{const e=[],b=D.banks.find(x=>x.id==id);if(b&&b.init)e.push({d:'0000',m:'موجودی اولیه',i:b.init,o:0});
D.invoices.filter(act).forEach(v=>v.pays.forEach(p=>{if(p.bank==id&&p.method!='چک'){const s=v.type=='sale';e.push({d:p.date||v.date,m:'فاکتور '+v.no,i:s?p.amount:0,o:s?0:p.amount})}}));
D.tx.forEach(t=>t.bank==id&&e.push({d:t.date,m:t.kind+': '+nm('cats',t.cat)+' '+(t.desc||''),i:t.kind=='درآمد'?t.amount:0,o:t.kind=='هزینه'?t.amount:0}));
D.cheques.forEach(c=>c.bank==id&&c.status=='وصول‌شده'&&e.push({d:c.rd||c.due,m:'چک '+c.number,i:c.kind=='دریافتی'?c.amount:0,o:c.kind=='دریافتی'?0:c.amount}));
return e.sort((a,b)=>a.d<b.d?-1:1)};
const bankBal=id=>bankEnt(id).reduce((a,e)=>a+e.i-e.o,0);
const pEnt=id=>{const e=[];D.invoices.filter(act).filter(v=>v.person==id).forEach(v=>{const t=tot(v).total,s=v.type=='sale';e.push({d:v.date,m:(s?'فروش ':'خرید ')+v.no,db:s?t:0,cr:s?0:t});v.pays.forEach(p=>e.push({d:p.date||v.date,m:'پرداخت '+p.method+' ('+v.no+')',db:s?0:p.amount,cr:s?p.amount:0}))});return e.sort((a,b)=>a.d<b.d?-1:1)};
const pBal=id=>pEnt(id).reduce((a,e)=>a+e.db-e.cr,0);
const balTxt=b=>b>0?'بدهکار '+fa(b):b<0?'بستانکار '+fa(-b):'۰';
function go(t){tab=t;q='';render();scrollTo(0,0)}
function render(){const th=D.set.theme;th?document.documentElement.setAttribute('data-theme',th):document.documentElement.removeAttribute('data-theme');
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('#main').innerHTML=tab=='home'?pHome():tab=='invoices'?pInv():tab=='reports'?pRep():tab=='settings'?pSet():crud(tab)}
const dueB=()=>{const p=D.cheques.filter(c=>c.status=='در جریان'&&dd(c.due)<=1).sort((a,b)=>a.due<b.due?-1:1);return p.map(c=>{const n=dd(c.due);return`<div class="bi ${n<=0?'br':'by'}"><b>${n<0?'سررسید گذشته':n==0?'امروز سررسید است':'فردا سررسید است'}</b> — چک ${esc(c.number)} (${c.kind}) ${esc(nm('persons',c.person))} — ${money(c.amount)}<div class=bt><button onclick="cclose('${c.id}')">بستن چک</button><button class=g style="color:#fff;border-color:#fff" onclick="cpost('${c.id}')">موقت کردن</button></div></div>`}).join('')};
function pHome(){const t=today(),ym=jym(t),y=ym.slice(0,4),SM=(ty,f)=>D.invoices.filter(v=>act(v)&&v.type==ty&&f(v.date)).reduce((a,v)=>a+tot(v).total,0);
let rc=0,py=0;D.persons.forEach(p=>{const b=pBal(p.id);b>0?rc+=b:py-=b});
const bk=D.banks.reduce((a,b)=>a+bankBal(b.id),0),ch=D.cheques.filter(c=>c.status=='در جریان'&&dd(c.due)<=7),low=D.items.filter(i=>i.kind=='کالا'&&i.min&&i.stock<=i.min).length;
const C=[['فروش امروز',SM('sale',d=>d==t)],['فروش این ماه',SM('sale',d=>jym(d)==ym)],['فروش امسال',SM('sale',d=>jym(d).slice(0,4)==y)],['خرید امروز',SM('purchase',d=>d==t)],['خرید این ماه',SM('purchase',d=>jym(d)==ym)],['طلب از اشخاص',rc],['بدهی به اشخاص',py],['موجودی بانک‌ها',bk]];
return dueB()+'<div class=cs>'+C.map(([l,v])=>`<div class=cd><small>${l}</small><b>${money(v)}</b></div>`).join('')+`<div class=cd><small>چک‌های ۷ روز آینده</small><b>${fa(ch.length)} چک — ${money(ch.reduce((a,c)=>a+c.amount,0))}</b></div><div class=cd><small>کمبود موجودی</small><b>${fa(low)} کالا</b></div></div><h3>فروش ماه‌های اخیر</h3>`+tbl2(mrep('sale',6))}
function crud(k){const s=SC[k];return(k=='cheques'?dueB()+'<p style="color:var(--m);font-size:12px">پرداخت فاکتور با چک را در خود فاکتور (روش «چک») ثبت کنید؛ تأثیر بانکی چک با وصول‌شدن اعمال می‌شود.</p>':'')+`<div class=tb><button onclick="form('${k}')">+ افزودن</button><input placeholder="جستجو…" value="${esc(q)}" oninput="q=this.value;$('#rt').innerHTML=tbl('${k}')">${k=='cheques'?`<select onchange="chq=this.value;render()">${['all','در جریان','وصول‌شده','برگشتی','منقضی'].map(x=>`<option value="${x}" ${x==chq?'selected':''}>${x=='all'?'همهٔ وضعیت‌ها':x}</option>`).join('')}</select>`:''}</div><div id=rt>${tbl(k)}</div>`}
function tbl(k){const s=SC[k];let rows=D[k].filter(r=>!q||JSON.stringify(r).includes(q));if(k=='cheques'){if(chq!='all')rows=rows.filter(r=>r.status==chq);rows.sort((a,b)=>a.due<b.due?-1:1)}if(k=='tx')rows.sort((a,b)=>a.date<b.date?1:-1);
const cl=r=>{if(k=='cheques'&&r.status=='در جریان'){const n=dd(r.due);return n<=1?'cr':n<=7?'cy':''}return k=='items'&&r.kind=='کالا'&&r.min&&r.stock<=r.min?'cr':''};
const cell=(c,r)=>{if(c=='bal')return k=='banks'?fa(bankBal(r.id)):balTxt(pBal(r.id));const f=s.f.find(x=>x[0]==c),v=r[c];return f[2]=='d'||f[2]=='e'?jd(v):f[2]=='n'?fa(v):f[2]=='r'?esc(nm(f[3],v)):esc(v)};
return`<div class=tw><table><tr>${s.cols.map(c=>`<th>${c=='bal'?'مانده':s.f.find(x=>x[0]==c)[1]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr class="${cl(r)}">${s.cols.map(c=>`<td>${cell(c,r)}</td>`).join('')}<td>${k=='persons'?`<button class="g s" onclick="rep='person';repArg='${r.id}';go('reports')">گردش</button> `:''}${k=='cheques'&&r.status=='در جریان'?`<button class="s" onclick="cclose('${r.id}')">بستن</button> <button class="g s" onclick="cpost('${r.id}')">موقت</button> `:''}<button class="g s" onclick="form('${k}','${r.id}')">ویرایش</button> <button class="g s" onclick="dl('${k}','${r.id}')">حذف</button></td></tr>`).join('')||'<tr><td>موردی نیست</td></tr>'}</table></div>`}
const inp=(n,t,o,v)=>t=='s'?`<select id="f_${n}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='r'?`<select id="f_${n}"><option value="">—</option>${D[o].map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x.name||x.number)}</option>`).join('')}</select>`:t=='d'||t=='e'?`<input id="f_${n}" type=date value="${v||(t=='d'?today():'')}">`:t=='n'?`<input id="f_${n}" inputmode=numeric value="${v?fa(v):''}" oninput="nf(this)">`:`<input id="f_${n}" value="${esc(v)}">`;
function form(k,id){const s=SC[k],r=id?D[k].find(x=>x.id==id):{};modal(`<h3>${id?'ویرایش':'افزودن'} — ${s.t}</h3><div class=g2>`+s.f.map(([n,l,t,o])=>`<label>${l}${inp(n,t,o,r[n])}</label>`).join('')+`</div><div class=bt><button onclick="sv('${k}','${id||''}')">ذخیره</button><button class=g onclick="mc()">انصراف</button></div>`)}
function sv(k,id){const s=SC[k],o={};for(const[n,l,t]of s.f){const e=$('#f_'+n);o[n]=t=='n'?pn(e.value):e.value}
if(s.f[0][0]=='name'&&!o.name.trim())return toast('نام را وارد کنید');if((k=='tx'||k=='cheques')&&!o.amount)return toast('مبلغ را وارد کنید');if(k=='cheques'&&!o.number)return toast('شمارهٔ چک را وارد کنید');
if(id)Object.assign(D[k].find(x=>x.id==id),o);else D[k].push({id:uid(),...o});mc();commit((id?'ویرایش ':'افزودن ')+s.t)}
function dl(k,id){modal(`<p>حذف شود؟</p><div class=bt><button class=d onclick="dl2('${k}','${id}')">حذف</button><button class=g onclick="mc()">انصراف</button></div>`)}
function dl2(k,id){if(JSON.stringify([D.persons,D.banks,D.cats,D.tx,D.cheques,D.items,D.invoices]).split(id).length-1>1){mc();return toast('در سوابق استفاده شده؛ به‌جای حذف، غیرفعال کنید')}D[k]=D[k].filter(x=>x.id!=id);mc();commit('حذف از '+SC[k].t)}
function cclose(id){const c=D.cheques.find(x=>x.id==id);modal(`<h3>بستن چک ${esc(c.number)}</h3><label>نتیجه<select id=cs><option>وصول‌شده</option><option>برگشتی</option><option>منقضی</option></select></label><label>تاریخ<input id=cd type=date value="${today()}"></label><div class=bt><button onclick="cc2('${id}')">ثبت</button><button class=g onclick="mc()">انصراف</button></div>`)}
function cc2(id){const c=D.cheques.find(x=>x.id==id);c.status=$('#cs').value;c.rd=$('#cd').value;mc();commit('بستن چک '+c.number)}
function cpost(id){const c=D.cheques.find(x=>x.id==id);modal(`<h3>موقت کردن چک ${esc(c.number)}</h3><label>تاریخ سررسید جدید<input id=cd type=date value="${c.due}"></label><div class=bt><button onclick="cp2('${id}')">ثبت</button><button class=g onclick="mc()">انصراف</button></div>`)}
function cp2(id){const c=D.cheques.find(x=>x.id==id);c.due=$('#cd').value;mc();commit('تغییر سررسید چک '+c.number)}
/* فاکتور */
const stL=v=>v.st=='draft'?'پیش‌نویس':v.st=='returned'?'برگشتی':tot(v).paid>=tot(v).total-.5?'پرداخت‌شده':'مانده‌دار';
function pInv(){return`<div class=tb><button onclick="invForm()">+ فاکتور جدید</button><input placeholder="جستجو…" value="${esc(q)}" oninput="q=this.value;$('#rt').innerHTML=itbl()"></div><div id=rt>${itbl()}</div>`}
function itbl(){const rows=D.invoices.filter(v=>!q||(v.no+nm('persons',v.person)).includes(q)).sort((a,b)=>a.date<b.date?1:-1);
return`<div class=tw><table><tr><th>شماره</th><th>نوع</th><th>تاریخ</th><th>شخص</th><th>جمع کل</th><th>پرداختی</th><th>مانده</th><th>وضعیت</th><th></th></tr>${rows.map(v=>{const t=tot(v);return`<tr><td>${v.no}</td><td>${v.type=='sale'?'فروش':'خرید'}</td><td>${jd(v.date)}</td><td>${esc(nm('persons',v.person))}</td><td>${fa(t.total)}</td><td>${fa(t.paid)}</td><td>${fa(Math.max(0,t.total-t.paid))}</td><td>${stL(v)}</td><td><button class="g s" onclick="pr('${v.id}')">چاپ</button> <button class="g s" onclick="payM('${v.id}')">پرداخت</button> <button class="g s" onclick="invForm('${v.id}')">ویرایش</button> <button class="g s" onclick="idl('${v.id}')">حذف</button></td></tr>`}).join('')||'<tr><td>فاکتوری نیست</td></tr>'}</table></div>`}
function stock(v,s){if(!act(v))return;v.lines.forEach(l=>{const it=D.items.find(x=>x.id==l.item);if(it&&it.kind=='کالا')it.stock=(+it.stock||0)+(v.type=='purchase'?1:-1)*s*l.qty})}
function invForm(id){cur=id?JSON.parse(JSON.stringify(D.invoices.find(x=>x.id==id))):{type:'sale',date:today(),person:'',tax:D.set.tax,disc:0,lines:[{item:'',desc:'',qty:1,price:0,disc:0}],pays:[],st:'auto'};cur.eid=id;drawInv()}
const payF=r=>`<div class=g2><label>مبلغ<input id=pa_a inputmode=numeric value="${r?fa(r):''}" oninput="nf(this)"></label><label>روش<select id=pa_m><option>نقد</option><option>کارت</option><option>انتقال بانکی</option><option>چک</option><option>سایر</option></select></label><label>بانک<select id=pa_b><option value="">—</option>${D.banks.map(b=>`<option value=${b.id}>${esc(b.name)}</option>`).join('')}</select></label><label>شمارهٔ پیگیری<input id=pa_r></label></div>`;
const rdPay=d=>({amount:pn($('#pa_a').value),method:$('#pa_m').value,bank:$('#pa_b').value,ref:$('#pa_r').value,date:d});
function drawInv(){const v=cur,P=D.persons.filter(p=>p.active!='غیرفعال'&&p.type==(v.type=='sale'?'مشتری':'فروشنده')),sl=(a,b)=>a==b?'selected':'';
modal(`<h3>${v.eid?'ویرایش':'ثبت'} فاکتور</h3><div class=g2><label>نوع<select id=iv_type onchange="readInv();cur.person='';drawInv()"><option value=sale ${sl(v.type,'sale')}>فروش</option><option value=purchase ${sl(v.type,'purchase')}>خرید</option></select></label><label>تاریخ<input id=iv_date type=date value="${v.date}"></label><label>${v.type=='sale'?'مشتری':'فروشنده'}<select id=iv_person><option value="">—</option>${P.map(p=>`<option value=${p.id} ${sl(p.id,v.person)}>${esc(p.name)}</option>`).join('')}</select></label><label>مالیات ٪<input id=iv_tax inputmode=decimal value="${v.tax}" oninput="upd()"></label><label>تخفیف کل<input id=iv_disc inputmode=numeric value="${v.disc?fa(v.disc):''}" oninput="nf(this);upd()"></label><label>وضعیت<select id=iv_st onchange=upd()><option value=auto ${sl(v.st,'auto')}>عادی</option><option value=draft ${sl(v.st,'draft')}>پیش‌نویس</option><option value=returned ${sl(v.st,'returned')}>برگشتی</option></select></label></div><h4>اقلام</h4>`+
v.lines.map((l,i)=>`<div class=ln><div class=g2><select id=li${i} onchange="pick(${i})"><option value="">شرح آزاد</option>${D.items.map(x=>`<option value=${x.id} ${sl(x.id,l.item)}>${esc(x.name)}</option>`).join('')}</select><input id=ld${i} placeholder="شرح" value="${esc(l.desc)}"></div><div class=g2><label>تعداد<input id=lq${i} type=number step=any value="${l.qty}" oninput=upd()></label><label>قیمت واحد<input id=lp${i} inputmode=numeric value="${l.price?fa(l.price):''}" oninput="nf(this);upd()"></label><label>تخفیف ٪<input id=lx${i} type=number value="${l.disc||0}" oninput=upd()></label><button class="d s" onclick="readInv();cur.lines.splice(${i},1);if(!cur.lines.length)cur.lines.push({item:'',desc:'',qty:1,price:0,disc:0});drawInv()">×</button></div></div>`).join('')+
`<button class=g onclick="readInv();cur.lines.push({item:'',desc:'',qty:1,price:0,disc:0});drawInv()">+ ردیف</button><h4>پرداخت‌ها</h4>`+v.pays.map((p,i)=>`<div>${p.method} — ${money(p.amount)} <button class="d s" onclick="readInv();cur.pays.splice(${i},1);drawInv()">×</button></div>`).join('')+payF(0)+`<button class=g onclick="addPay()">+ افزودن پرداخت</button><div class=pn style="margin-top:10px" id=tt></div><div class=bt><button onclick="saveInv()">ذخیره</button><button class=g onclick="mc()">انصراف</button></div>`);upd()}
function readInv(){const v=cur;v.type=$('#iv_type').value;v.date=$('#iv_date').value;v.person=$('#iv_person').value;v.tax=+$('#iv_tax').value||0;v.disc=pn($('#iv_disc').value);v.st=$('#iv_st').value;v.lines.forEach((l,i)=>{l.item=$('#li'+i).value;l.desc=$('#ld'+i).value;l.qty=+$('#lq'+i).value||0;l.price=pn($('#lp'+i).value);l.disc=+$('#lx'+i).value||0})}
function upd(){readInv();const t=tot(cur);$('#tt').innerHTML=`جمع اقلام: ${money(t.sub)}<br>مالیات: ${money(t.tx)}<br><b>جمع کل: ${money(t.total)}</b><br>پرداخت‌شده: ${money(t.paid)} — مانده: ${money(Math.max(0,t.total-t.paid))}`}
function pick(i){readInv();const l=cur.lines[i],it=D.items.find(x=>x.id==l.item);if(it){l.desc=it.name;l.unit=it.unit;l.price=cur.type=='sale'?it.sell:it.buy}drawInv()}
function addPay(){readInv();const p=rdPay(cur.date);if(!p.amount)return toast('مبلغ پرداخت را وارد کنید');cur.pays.push(p);drawInv()}
function saveInv(){readInv();const v=cur;v.lines=v.lines.filter(l=>l.qty>0&&(l.item||l.desc));if(!v.lines.length)return toast('حداقل یک ردیف لازم است');
if(v.pays.length==0){const a=pn($('#pa_a').value);if(a)v.pays.push(rdPay(v.date))}
const eid=v.eid;delete v.eid;if(eid){const o=D.invoices.find(x=>x.id==eid);stock(o,-1);v.no=o.no;v.id=eid;D.invoices[D.invoices.indexOf(o)]=v}else{const ym=jym(v.date),n=D.invoices.filter(x=>x.type==v.type&&x.no.includes(ym)).map(x=>+x.no.split('-').pop());v.id=uid();v.no=(v.type=='sale'?'ف-':'خ-')+ym+'-'+(Math.max(0,...n)+1);D.invoices.push(v)}
stock(v,1);mc();commit('ثبت فاکتور '+v.no)}
function payM(id){const v=D.invoices.find(x=>x.id==id),t=tot(v);modal(`<h3>پرداخت فاکتور ${v.no}</h3>${payF(Math.max(0,t.total-t.paid))}<div class=bt><button onclick="pay2('${id}')">ثبت</button><button class=g onclick="mc()">انصراف</button></div>`)}
function pay2(id){const p=rdPay(today());if(!p.amount)return toast('مبلغ را وارد کنید');D.invoices.find(x=>x.id==id).pays.push(p);mc();commit('پرداخت فاکتور')}
function idl(id){modal(`<p>فاکتور حذف و موجودی برگردانده شود؟</p><div class=bt><button class=d onclick="idl2('${id}')">حذف</button><button class=g onclick="mc()">انصراف</button></div>`)}
function idl2(id){const v=D.invoices.find(x=>x.id==id);stock(v,-1);D.invoices=D.invoices.filter(x=>x.id!=id);mc();commit('حذف فاکتور '+v.no)}
function prt(h){$('#pa').innerHTML=h;window.print()}
function pr(id){const v=D.invoices.find(x=>x.id==id),t=tot(v),s=D.set;prt(`<h2>${esc(s.name)}</h2><div>${esc(s.addr||'')}</div><h3>فاکتور ${v.type=='sale'?'فروش':'خرید'} — شمارهٔ ${v.no}</h3><p>تاریخ: ${jd(v.date)} — ${v.type=='sale'?'خریدار':'فروشنده'}: ${esc(nm('persons',v.person))}</p><table><tr><th>شرح</th><th>تعداد</th><th>قیمت واحد</th><th>تخفیف٪</th><th>جمع</th></tr>${v.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td>${fa(l.qty)}</td><td>${fa(l.price)}</td><td>${fa(l.disc)}</td><td>${fa(l.qty*l.price*(1-l.disc/100))}</td></tr>`).join('')}</table><p>جمع: ${money(t.sub)} | تخفیف: ${money(v.disc)} | مالیات (${fa(v.tax)}٪): ${money(t.tx)}</p><h3>قابل پرداخت: ${money(t.total)}</h3><p>پرداخت‌شده: ${money(t.paid)} — مانده: ${money(Math.max(0,t.total-t.paid))}</p>`)}
/* گزارش‌ها */
function mrep(ty,lim){const m={};D.invoices.filter(v=>act(v)&&v.type==ty).forEach(v=>{const k=jym(v.date),t=tot(v);m[k]=m[k]||[0,0,0,0];m[k][0]++;m[k][1]+=t.af;m[k][2]+=t.tx;m[k][3]+=t.total});let ks=Object.keys(m).sort();if(lim)ks=ks.slice(-lim);return{h:['ماه','تعداد','قبل از مالیات','مالیات','جمع'],r:ks.map(k=>[k,...m[k]]),bar:4}}
function mm(f){const m={};f(m);return m}
function stmt(e,a,b,sg){let r=0;return{h:['تاریخ','شرح',a,b,'مانده'],r:e.map(x=>{const A=x.i??x.db,B=x.o??x.cr;r+=A-B;return[jd(x.d),x.m,A,B,r]})}}
const REPS={
sales:['فروش ماهانه',()=>mrep('sale')],buy:['خرید ماهانه',()=>mrep('purchase')],
cat:['درآمد و هزینه بر اساس دسته',()=>{const m={};D.tx.forEach(t=>{const c=D.cats.find(x=>x.id==t.cat),k=t.kind+' | '+(c?(c.parent?nm('cats',c.parent)+' › ':'')+c.name:'بدون دسته');m[k]=(m[k]||0)+t.amount});return{h:['دسته','جمع'],r:Object.keys(m).sort().map(k=>[k,m[k]]),bar:1}}],
pl:['سود و زیان ماهانه',()=>{const m={};const g=(k,i,v)=>{m[k]=m[k]||[0,0];m[k][i]+=v};D.invoices.filter(act).forEach(v=>g(jym(v.date),v.type=='sale'?0:1,tot(v).af));D.tx.forEach(t=>g(jym(t.date),t.kind=='درآمد'?0:1,t.amount));const ks=Object.keys(m).sort(),r=ks.map(k=>[k,m[k][0],m[k][1],m[k][0]-m[k][1]]);r.push(['جمع',...[1,2,3].map(i=>r.reduce((a,x)=>a+x[i],0))]);return{h:['ماه','درآمد (فروش + سایر)','هزینه (خرید + هزینه‌ها)','سود / زیان'],r}}],
tax:['گزارش مالیاتی',()=>{const m={};D.invoices.filter(act).forEach(v=>{const k=jym(v.date);m[k]=m[k]||[0,0];m[k][v.type=='sale'?0:1]+=tot(v).tx});const ks=Object.keys(m).sort(),r=ks.map(k=>[k,m[k][0],m[k][1],m[k][0]-m[k][1]]);r.push(['جمع',...[1,2,3].map(i=>r.reduce((a,x)=>a+x[i],0))]);return{h:['ماه','مالیات فروش','مالیات خرید','قابل پرداخت'],r}}],
chq:['سررسید چک‌ها',()=>({h:['شماره','نوع','شخص','بانک','مبلغ','سررسید','وضعیت','روز مانده'],r:[...D.cheques].sort((a,b)=>a.due<b.due?-1:1).map(c=>{const n=dd(c.due);return[c.number,c.kind,nm('persons',c.person),nm('banks',c.bank),c.amount,jd(c.due),c.status,c.status!='در جریان'?'—':n<0?'گذشته ('+fa(-n)+' روز)':fa(n)]})})],
bank:['گردش بانک',()=>{const id=repArg||(D.banks[0]||{}).id;return stmt(bankEnt(id),'واریز','برداشت')}],
person:['گردش حساب شخص',()=>{const id=repArg||(D.persons[0]||{}).id,d=stmt(pEnt(id),'بدهکار','بستانکار');d.h[4]='مانده (+ بدهکار / − بستانکار)';return d}],
bal:['مانده اشخاص',()=>({h:['شخص','نوع','مانده'],r:D.persons.map(p=>[p.name,p.type,balTxt(pBal(p.id))])})],
stk:['موجودی انبار',()=>({h:['کالا','موجودی','قیمت خرید','ارزش'],r:D.items.filter(i=>i.kind=='کالا').map(i=>[i.name,i.stock,i.buy,i.stock*i.buy]),bar:3})]};
function tbl2(d){const mx=d.bar!=null?Math.max(1,...d.r.map(x=>Math.abs(+x[d.bar])||0)):1;return`<div class=tw><table><tr>${d.h.map(h=>`<th>${h}</th>`).join('')}${d.bar!=null?'<th></th>':''}</tr>${d.r.map(r=>`<tr>${r.map(c=>`<td>${typeof c=='number'?fa(c):esc(c)}</td>`).join('')}${d.bar!=null?`<td style="width:120px"><div class=bar style="width:${Math.abs(r[d.bar])/mx*100}%"></div></td>`:''}</tr>`).join('')||'<tr><td>داده‌ای نیست</td></tr>'}</table></div>`}
function pRep(){const d=last=REPS[rep][1](),ent=rep=='bank'?D.banks:rep=='person'?D.persons:null;
return`<div class=tb><select onchange="rep=this.value;repArg='';render()">${Object.keys(REPS).map(k=>`<option value=${k} ${k==rep?'selected':''}>${REPS[k][0]}</option>`).join('')}</select>${ent?`<select onchange="repArg=this.value;render()">${ent.map(x=>`<option value=${x.id} ${x.id==(repArg||ent[0].id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}<button onclick="clip([last.h,...last.r].map(r=>r.join('\\t')).join('\\n'))">کپی برای اکسل</button><button class=g onclick="prt('<h2>'+REPS[rep][0]+'</h2>'+tbl2(last))">چاپ / PDF</button></div>`+tbl2(d)}
function pSet(){const s=D.set;return`<div class=pn><h3>تنظیمات</h3><div class=g2><label>نام کسب‌وکار<input id=s_n value="${esc(s.name)}"></label><label>آدرس / تلفن روی فاکتور<input id=s_a value="${esc(s.addr)}"></label><label>مالیات پیش‌فرض ٪<input id=s_t value="${s.tax}"></label><label>واحد پول<select id=s_u>${['تومان','ریال','دلار'].map(u=>`<option ${u==s.unit?'selected':''}>${u}</option>`).join('')}</select></label><label>تم<select id=s_h>${[['','خودکار'],['light','روشن'],['dark','تاریک']].map(([a,b])=>`<option value="${a}" ${a==s.theme?'selected':''}>${b}</option>`).join('')}</select></label></div><div class=bt><button onclick="ss()">ذخیره</button></div></div><div class=pn><h3>پشتیبان‌گیری</h3><textarea id=bk rows=3>${esc(JSON.stringify(D))}</textarea><div class=bt><button onclick="clip($('#bk').value)">کپی پشتیبان</button><button class=g onclick="rest()">بازیابی از متن</button></div></div><h3>سابقهٔ عملیات</h3>`+tbl2({h:['زمان','عملیات'],r:D.log.slice(0,50).map(l=>[l.t,l.m])})}
function ss(){Object.assign(D.set,{name:$('#s_n').value,addr:$('#s_a').value,tax:+$('#s_t').value||0,unit:$('#s_u').value,theme:$('#s_h').value});commit('تغییر تنظیمات');toast('ذخیره شد')}
function rest(){try{const x=JSON.parse($('#bk').value);if(!x.invoices||!x.persons)throw 0;D={...D,...x};commit('بازیابی پشتیبان');toast('بازیابی شد')}catch(e){toast('متن پشتیبان معتبر نیست')}}
render();
</script></body></html>
